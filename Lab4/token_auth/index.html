<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    </head>

    <body>
        <main id="main-holder">
            <a href="/logout" id="logout">Logout</a>

            <h1 id="login-header">Login</h1>

            <div id="login-error-msg-holder">
                <p id="login-error-msg">Invalid username <span id="error-msg-second-line">and/or password</span></p>
            </div>

            <form id="login-form" action="/api/login" method="post">
                <input type="text" name="login" id="username-field" class="login-form-field" placeholder="Email">
                <input type="password" name="password" id="password-field" class="login-form-field" placeholder="Password">
                <input type="submit" value="Login" id="login-form-submit">
                <input type="button" value="Register" id="register-button" style="width:100%;margin-top:7px;padding:7px;border:1px solid #3a3a3a;border-radius:5px;background:white;cursor:pointer;">
                <p id="register-msg" style="font-size:12px;text-align:center;"></p>
            </form>

        </main>
    </body>


    <style>
        html {
            height: 100%;
        }

        body {
            height: 100%;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            display: grid;
            justify-items: center;
            align-items: center;
            background-color: #3a3a3a;
        }

        #logout {
            opacity: 0;
        }

        #main-holder {
            width: 50%;
            height: 70%;
            display: grid;
            justify-items: center;
            align-items: center;
            background-color: white;
            border-radius: 7px;
            box-shadow: 0px 0px 5px 2px black;
        }

        #login-form {
            align-self: flex-start;
            display: grid;
            justify-items: center;
            align-items: center;
        }

        .login-form-field {
            border: none;
            border-bottom: 1px solid #3a3a3a;
            margin-bottom: 10px;
            border-radius: 3px;
            outline: none;
            padding: 0px 0px 5px 5px;
        }

        #login-form-submit {
            width: 100%;
            padding: 7px;
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            background-color: #3a3a3a;
            cursor: pointer;
            outline: none;
        }

        #auth-status {
            width: 84%;
            align-self: start;
            font-size: 16px;
        }

        #auth-status h2 {
            margin: 0 0 14px;
            text-align: center;
        }

        #auth-status h2 + h2 {
            margin-top: 0;
            color: #168b3a;
            font-size: 18px;
        }

        #auth-status p {
            margin: 12px 0;
        }

        #auth-status p:nth-of-type(-n+4) {
            padding-bottom: 8px;
            border-bottom: 1px solid #e5e5e5;
        }

        #access-token-info {
            width: 100%;
            min-height: 84px;
            box-sizing: border-box;
            padding: 8px;
            resize: vertical;
            border: 1px solid #bdbdbd;
            border-radius: 4px;
            color: #3a3a3a;
            background: #fafafa;
            font-family: monospace;
            font-size: 10px;
        }

        .auth-action {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            background-color: #3a3a3a;
            cursor: pointer;
        }

        .auth-action:hover {
            background-color: #222222;
        }

        #login-error-msg-holder {
            width: 100%;
            height: 100%;
            display: grid;
            justify-items: center;
            align-items: center;
        }

        #login-error-msg {
            width: 23%;
            text-align: center;
            margin: 0;
            padding: 5px;
            font-size: 12px;
            font-weight: bold;
            color: #8a0000;
            border: 1px solid #8a0000;
            background-color: #e58f8f;
            opacity: 0;
        }

        #error-msg-second-line {
            display: block;
        }

        .login-form-field::placeholder {
            color: #3a3a3a;
        }
    </style>

    <script>
        const session = sessionStorage.getItem('session');

        let token;

        try {
            token = JSON.parse(session).token;
        } catch(e) {}

        if (token) {
            axios.get('/', {
                headers: {
                    Authorization: token
                }
            }).then((response) => {
                const {
                    username,
                    accessToken,
                    refreshTokenAvailable,
                    tokenExpiresInSeconds,
                    tokenRefreshed
                } = response.data;

                if (username) {
                    const mainHolder = document.getElementById("main-holder");
                    const loginHeader = document.getElementById("login-header");

                    loginForm.remove();
                    loginErrorMsg.remove();
                    loginHeader.remove();

                    const authStatus = document.createElement('section');
                    authStatus.id = 'auth-status';
                    authStatus.innerHTML = `
                        <h2>Auth0 Authentication</h2>
                        <h2>Login successful</h2>
                        <p><strong>User:</strong> ${escapeHtml(username)}</p>
                        <p><strong>Refresh token:</strong> ${refreshTokenAvailable ? 'available' : 'not available'}</p>
                        <p><strong>Remaining token lifetime:</strong> <span id="token-lifetime">${formatLifetime(tokenExpiresInSeconds)}</span></p>
                        <p><strong>Last refresh:</strong> <span id="last-refresh">${tokenRefreshed ? 'token refreshed' : 'token is still valid'}</span></p>
                        <p><strong>Access Token:</strong></p>
                        <textarea id="access-token-info" readonly></textarea>
                        <button type="button" class="auth-action" id="check-token-button">Check token lifetime</button>
                    `;
                    mainHolder.append(authStatus);
                    document.getElementById('access-token-info').value = accessToken || 'Access token is unavailable';
                    logoutLink.style.opacity = 1;

                    document.getElementById('check-token-button').addEventListener('click', checkTokenLifetime);
                }
            }).catch(() => {
                // токен протерміновано і оновити не вдалося
                sessionStorage.removeItem('session');
                location.reload();
            });
        }


        const loginForm = document.getElementById("login-form");
        const loginButton = document.getElementById("login-form-submit");
        const loginErrorMsg = document.getElementById("login-error-msg");
        const logoutLink =  document.getElementById("logout");

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, (character) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[character]));
        }

        function formatLifetime(seconds) {
            return Number.isFinite(seconds) ? `${Math.max(0, seconds)} seconds` : 'unknown';
        }

        function checkTokenLifetime() {
            const button = document.getElementById('check-token-button');
            button.disabled = true;

            axios.get('/', {
                headers: {
                    Authorization: token
                }
            }).then((response) => {
                const { accessToken, tokenExpiresInSeconds, tokenRefreshed } = response.data;
                document.getElementById('token-lifetime').textContent = formatLifetime(tokenExpiresInSeconds);
                document.getElementById('last-refresh').textContent =
                    tokenRefreshed ? 'token refreshed' : 'token is still valid';
                if (accessToken) {
                    document.getElementById('access-token-info').value = accessToken;
                }
            }).catch(() => {
                sessionStorage.removeItem('session');
                location.reload();
            }).finally(() => {
                button.disabled = false;
            });
        }

        logoutLink.addEventListener("click", (e) => {
            e.preventDefault();
            sessionStorage.removeItem('session');
            location.reload();
        });

        document.getElementById("register-button").addEventListener("click", (e) => {
            e.preventDefault();
            const msg = document.getElementById("register-msg");
            axios.post('/api/register', {
                login: loginForm.login.value,
                password: loginForm.password.value
            }).then((response) => {
                msg.style.color = 'green';
                msg.textContent = 'User created: ' + response.data.email;
            }).catch((error) => {
                msg.style.color = '#8a0000';
                msg.textContent = (error.response && error.response.data.error) || 'Register failed';
            });
        });

        loginButton.addEventListener("click", (e) => {
            e.preventDefault();
            const login = loginForm.login.value;
            const password = loginForm.password.value;


            axios({
                method: 'post',
                url: '/api/login',
                data: {
                    login,
                    password
                }
            }).then((response) => {
                const { username } =  response.data;
                sessionStorage.setItem('session', JSON.stringify(response.data));
                location.reload();
            }).catch((response) => {
                loginErrorMsg.style.opacity = 1;
            });
        })
    </script>
</html>
